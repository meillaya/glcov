name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.os }} / OTP ${{ matrix.otp }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        otp: ["27", "28"]
    steps:
      - uses: actions/checkout@v4

      - uses: erlef/setup-beam@v1
        with:
          otp-version: ${{ matrix.otp }}
          gleam-version: "1.19.2"

      - name: Download dependencies
        run: gleam deps download

      - name: Check formatting
        run: gleam format --check src test

      - name: Build with warnings as errors
        run: gleam build --warnings-as-errors

      - name: Unit tests
        run: gleam test

      - name: Integration tests
        shell: bash
        run: bash integration/run.sh

  javascript:
    name: JavaScript coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: erlef/setup-beam@v1
        with:
          otp-version: "28"
          gleam-version: "1.19.2"

      - name: Install c8
        run: npm install --global c8@10.1.3

      - name: Download dependencies
        working-directory: integration/fixtures/js_target
        run: gleam deps download

      - name: Run JavaScript coverage
        working-directory: integration/fixtures/js_target
        run: gleam run --target erlang -m glcov -- run --target javascript --min 100
